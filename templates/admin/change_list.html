{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Add counts to "All" options in filters
    const filterLists = document.querySelectorAll('#changelist-filter ul');
    
    filterLists.forEach(function(filterList) {
        const allLink = filterList.querySelector('li:first-child a');
        if (allLink && allLink.textContent.trim() === 'All') {
            // Get total count from the first filter item with count
            const countItems = filterList.querySelectorAll('li a');
            let totalCount = 0;
            
            countItems.forEach(function(item) {
                const match = item.textContent.match(/\((\d+)\)/);
                if (match) {
                    totalCount += parseInt(match[1]);
                }
            });
            
            if (totalCount > 0) {
                allLink.textContent = `All (${totalCount})`;
            }
        }
    });
});
</script>

<style>
/* Filter persistence status styles */
.filter-status {
    background: #e8f5e8;
    border: 1px solid #4caf50;
    padding: 8px 12px;
    margin: 10px 0;
    border-radius: 4px;
    font-size: 12px;
    color: #2e7d32;
}

.clear-filters-btn {
    background: #dc3545 !important;
    color: white !important;
    border: none !important;
    padding: 8px 16px !important;
    border-radius: 4px !important;
    cursor: pointer !important;
    font-size: 12px !important;
    width: 100% !important;
    margin-top: 10px !important;
}

.clear-filters-btn:hover {
    background: #c82333 !important;
}
</style>
{% endblock %}

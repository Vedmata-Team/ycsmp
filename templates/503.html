{% load static %}
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 - सेवा अनुपलब्ध</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            animation: blink 1.5s infinite;
        }

        .error-title {
            font-size: 2rem;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .error-message {
            font-size: 1.1rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .quick-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .action-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            color: white;
            text-decoration: none;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        @media (max-width: 768px) {
            .error-code { font-size: 5rem; }
            .error-title { font-size: 1.5rem; }
            .error-container { padding: 30px 20px; }
            .quick-actions { flex-direction: column; align-items: center; }
            .action-btn { width: 200px; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">503</div>
        <h1 class="error-title">सेवा अनुपलब्ध</h1>
        <p class="error-message">
            वेबसाइट अस्थायी रूप से रखरखाव के लिए बंद है। कृपया कुछ समय बाद पुनः प्रयास करें।
        </p>
        
        <div class="quick-actions">
            <a href="javascript:setTimeout(() => location.reload(), 10000)" class="action-btn">
                <i class="bi bi-arrow-clockwise"></i>
                10 सेकंड में रीलोड
            </a>
            <a href="/" class="action-btn">
                <i class="bi bi-house-door"></i>
                मुख्य पृष्ठ
            </a>
            <a href="tel:+919258360962" class="action-btn">
                <i class="bi bi-telephone"></i>
                संपर्क करें
            </a>
            <a href="javascript:history.back()" class="action-btn">
                <i class="bi bi-arrow-left"></i>
                वापस जाएं
            </a>
        </div>
    </div>
</body>
</html>
